name: Auto-Check IPTV

on:
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta automáticamente cada 6 horas
  workflow_dispatch:      # Permite ejecutarlo manualmente desde la pestaña Actions de GitHub

jobs:
  update-m3u:
  permissions:
    contents: write
  runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script de verificación
        run: python check_streams.py

      - name: Guardar cambios si hubo modificaciones
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canales.m3u
          git diff --staging --quiet || git commit -m "Auto-actualización de links M3U8 caídos [skip ci]"
          git push
