<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Panel - ZipTV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #252538;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 400px;
      color: #ffffff;
    }

    .login-card h2 {
      margin-bottom: 1.5rem;
      text-align: center;
      font-size: 1.8rem;
      color: #00d2ff;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #b3b3b3;
    }

    /* Contenedor relativo para posicionar el botón de la contraseña */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 2.5rem 0.75rem 1rem; /* Espacio extra a la derecha para el botón */
      border: 1px solid #3d3d5c;
      border-radius: 6px;
      background: #1a1a2e;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      border-color: #00d2ff;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: #b3b3b3;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .toggle-password:hover {
      color: #00d2ff;
    }

    .btn-submit {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 6px;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.3s;
      margin-top: 1rem;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .error-msg {
      color: #ff4d4d;
      font-size: 0.85rem;
      margin-top: 1rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>CONTROL PANEL</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" required placeholder="Tu usuario" autocomplete="off">
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="password" required placeholder="••••••••" autocomplete="off">
          <button type="button" id="togglePasswordBtn" class="toggle-password" title="Mostrar/Ocultar contraseña">
            👁️
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit">Ingresar</button>
      <p id="errorMsg" class="error-msg">Usuario o contraseña incorrectos</p>
    </form>
  </div>

  <script>
    // 
    const TARGET_USER = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";

    // 
    const TARGET_PASS = "c0fa4a86dbf8ca149ee681121d15bf1dd4ef7c06ca4ca7ec31a6135ef00a061d";

    //
    const TARGET_URL = "aHR0cHM6Ly9lcmFkaW8uZW52LnBt";

    // 
    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("togglePasswordBtn");

    togglePasswordBtn.addEventListener("click", function() {
      const isPassword = passwordInput.getAttribute("type") === "password";
      passwordInput.setAttribute("type", isPassword ? "text" : "password");
      this.textContent = isPassword ? "🙈" : "👁️";
    });

    // Función para calcular hash SHA-256
    async function getHash(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    // Validar formulario de Login
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const userInput = document.getElementById("username").value.trim().toLowerCase();
      const passInput = passwordInput.value.trim();
      const errorMsg = document.getElementById("errorMsg");

      const userHash = await getHash(userInput);
      const passHash = await getHash(passInput);

      if (userHash === TARGET_USER && passHash === TARGET_PASS) {
        window.location.href = atob(TARGET_URL);
      } else {
        errorMsg.style.display = "block";
      }
    });
  </script>

</body>
</html>
